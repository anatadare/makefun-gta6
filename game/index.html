<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmara: an open-world crime game in a sun-soaked coastal city. Eight story missions, a stadium, a day/night cycle, and a police force that does not give up. Drive, steal, run, and stay out of jail.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d2b33'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23ffd23f'%3E%E2%98%85%3C/text%3E%3C/svg%3E">
<title>Solmara — an open-world crime story</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0d2b33;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  /* Heard, not seen: the status line a screen reader announces. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmara: drive and explore a sun-soaked coastal city, take jobs, outrun the police, day and night"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>

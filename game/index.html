<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmara — Open-World Crime Game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #060a12;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    background: #060a12;
    image-rendering: auto;
    cursor: crosshair;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f5c518;
    font: bold 28px system-ui, sans-serif;
    letter-spacing: 4px;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="loading">SOLMARA</div>
<script type="module" src="src/main.js"></script>
<script>
  // The loading word fades once the game draws its first frame.
  const loading = document.getElementById('loading');
  const canvas = document.getElementById('game');
  const hide = () => { loading.style.display = 'none'; };
  new MutationObserver(hide).observe(canvas, { attributes: true });
  setTimeout(hide, 2500);
  window.addEventListener('solmara-ready', hide);
</script>
</body>
</html>
